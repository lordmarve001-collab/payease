; PayEase Scheduler Supervisor configuration
; Ensures the Laravel scheduler runs every minute.
; Copy to /etc/supervisor/conf.d/payease-scheduler.conf
; Then run: supervisorctl reread && supervisorctl update && supervisorctl start payease-scheduler

[program:payease-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while [ true ]; do php /var/www/payease/current/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/payease/scheduler.log

; PayEase Horizon Supervisor configuration
; Copy to /etc/supervisor/conf.d/payease-horizon.conf on Ubuntu/Debian
; Then run: supervisorctl reread && supervisorctl update && supervisorctl start payease-horizon:*

[program:payease-horizon]
process_name=%(program_name)s
command=php /var/www/payease/current/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/payease/horizon.log
stopwaitsecs=3600
